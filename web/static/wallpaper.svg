<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ExamVision wallpaper: dusk sky over a mountain range (drawn by hand, no photo, works offline). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24424c"/>
      <stop offset="0.45" stop-color="#46707a"/>
      <stop offset="0.72" stop-color="#7fa5a8"/>
      <stop offset="1" stop-color="#9dbdbc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#cfe3df" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cfe3df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa6ab"/>
      <stop offset="1" stop-color="#5d7c83"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f1f0"/>
      <stop offset="0.35" stop-color="#b9cdcd"/>
      <stop offset="1" stop-color="#3e5a61"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5d64"/>
      <stop offset="1" stop-color="#27393e"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22343a"/>
      <stop offset="1" stop-color="#141e22"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d0cf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8d0cf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b8d0cf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g fill="#ffffff">
    <circle cx="140" cy="90" r="1.3" opacity=".7"/><circle cx="410" cy="170" r="1" opacity=".5"/>
    <circle cx="620" cy="60" r="1.4" opacity=".8"/><circle cx="880" cy="140" r="1" opacity=".45"/>
    <circle cx="1030" cy="45" r="1.2" opacity=".6"/><circle cx="1250" cy="120" r="1.5" opacity=".75"/>
    <circle cx="1480" cy="70" r="1" opacity=".5"/><circle cx="1690" cy="160" r="1.3" opacity=".65"/>
    <circle cx="1840" cy="55" r="1" opacity=".5"/><circle cx="300" cy="260" r="1" opacity=".35"/>
    <circle cx="760" cy="250" r="1.1" opacity=".4"/><circle cx="1380" cy="240" r="1" opacity=".35"/>
    <circle cx="1760" cy="300" r="1.2" opacity=".4"/><circle cx="1120" cy="310" r=".9" opacity=".3"/>
  </g>

  <!-- far range -->
  <path fill="url(#far)" opacity=".85" d="M0 720 L120 660 L230 690 L360 610 L470 650 L560 600 L700 670 L820 640 L940 690 L1080 620 L1200 660 L1330 600 L1460 650 L1600 590 L1740 640 L1920 600 L1920 1080 L0 1080 Z"/>

  <!-- main peak with snow -->
  <path fill="url(#peak)" d="M620 820 L860 620 L960 540 L1010 470 L1045 455 L1080 490 L1140 560 L1230 610 L1330 700 L1480 780 L1600 840 L620 840 Z"/>
  <path fill="#f4f8f7" opacity=".85" d="M960 540 L1010 470 L1045 455 L1080 490 L1110 530 L1080 520 L1060 545 L1035 515 L1005 560 L985 540 Z"/>
  <path fill="#2f464c" opacity=".55" d="M1045 455 L1080 490 L1140 560 L1230 610 L1330 700 L1480 780 L1600 840 L1100 840 L1120 700 L1070 600 Z"/>

  <!-- left shoulder -->
  <path fill="url(#peak)" opacity=".9" d="M0 800 L150 740 L260 690 L330 650 L360 640 L400 668 L470 700 L600 760 L720 820 L0 840 Z"/>
  <path fill="#eef4f3" opacity=".7" d="M300 668 L330 650 L360 640 L400 668 L380 672 L360 660 L335 676 Z"/>

  <rect y="720" width="1920" height="170" fill="url(#mist)"/>

  <!-- mid range -->
  <path fill="url(#mid)" d="M0 860 L180 800 L330 830 L500 780 L660 830 L800 800 L980 850 L1150 800 L1320 840 L1500 790 L1680 830 L1920 780 L1920 1080 L0 1080 Z"/>

  <!-- near hills -->
  <path fill="url(#near)" d="M0 950 L220 900 L420 930 L640 890 L860 940 L1080 905 L1300 950 L1520 910 L1740 945 L1920 915 L1920 1080 L0 1080 Z"/>
</svg>
