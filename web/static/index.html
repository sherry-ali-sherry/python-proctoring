<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExamVision Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a7fc9'/%3E%3Cellipse cx='16' cy='16' rx='10' ry='6.5' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='white'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1b2629">
<!-- Rubik; if offline, the system sans-serif stack in styles.css is used instead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/static/styles.css?v=1.3">
</head>
<body>
<div class="wallpaper" aria-hidden="true"><div class="wallpaper-image"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" aria-label="ExamVision home">
      <span class="wordmark"><span>EXAM</span><span>VISION</span></span>
    </a>
    <span class="brand-divider" aria-hidden="true"></span>
    <nav>
      <a href="#/" data-nav="list">Analyses</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="topbar-clock" id="topbar-clock" aria-hidden="true"></div>
    <div class="topbar-actions">
      <button class="btn outline small reviewer-chip" id="reviewer-chip" type="button" title="Change reviewer name"></button>
      <a class="btn primary small" href="#/new" data-nav="new">New analysis</a>
    </div>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="toasts" aria-live="polite"></div>

<dialog id="reviewer-dialog">
  <form method="dialog" id="reviewer-form">
    <h2>Who is reviewing?</h2>
    <p class="muted">Your name is recorded with every decision you make. It is remembered in this browser.</p>
    <label for="reviewer-input">Your name</label>
    <input id="reviewer-input" autocomplete="name" maxlength="80" required>
    <div class="actions">
      <button value="cancel" formnovalidate class="btn ghost">Cancel</button>
      <button value="ok" class="btn primary">Save</button>
    </div>
  </form>
</dialog>
<script src="/static/app.js?v=1.3"></script>
</body>
</html>
